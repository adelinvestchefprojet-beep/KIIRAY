<title>MOUV SUITE — Gestion des activités militantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
--blue-900:#004F2A;--blue-800:#006B34;--blue-700:#00833F;--blue-600:#0A9A4A;--blue-500:#24A95B;--blue-100:#D9F1E2;--blue-50:#EFF9F2;
--green-700:#006B34;--green-600:#00833F;--green-100:#D9F1E2;--green-50:#EFF9F2;
--amber-700:#A81F20;--amber-600:#C82A2B;--amber-100:#F7D6D6;--amber-50:#FCEAEA;
--red-600:#C82A2B;--red-100:#F7D6D6;--red-50:#FCEAEA;
--ink-900:#151A21;--ink-700:#333B46;--ink-600:#5B6472;--ink-500:#6E7785;--ink-400:#8B94A3;--ink-300:#B7BFC9;
--line:#E4E9E4;--line-soft:#EFF3EF;--bg:#F5F8F5;--card:#FFFFFF;
--radius-sm:8px;--radius-md:12px;--radius-lg:18px;
--shadow-card:0 1px 2px rgba(0,79,42,.05), 0 1px 12px rgba(0,79,42,.07);
--font-display:'Sora',sans-serif;--font-body:'Inter',sans-serif;
--shadow-soft:0 1px 2px rgba(0,79,42,.04), 0 8px 26px rgba(0,79,42,.07);
--ring:0 0 0 3px rgba(0,131,63,.16);
--grad-green:linear-gradient(135deg,#00833F 0%,#0A9A4A 100%);
--grad-deep:linear-gradient(135deg,#004F2A 0%,#00833F 62%,#0A9A4A 100%);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink-900);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--blue-900);letter-spacing:-.01em;}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
a{color:inherit;text-decoration:none;}
.icon{width:18px;height:18px;flex-shrink:0;}
.icon-sm{width:15px;height:15px;flex-shrink:0;}
#shell{display:flex;min-height:100vh;min-height:100dvh;}
#sidebar{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;box-shadow:1px 0 0 var(--line);}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px 22px;border-bottom:none;background:var(--grad-deep);}
.brand-mark{width:46px;height:46px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-family:var(--font-display);font-weight:800;font-size:15px;overflow:hidden;padding:3px;}
.brand-text{line-height:1.15;}
.brand-text .b1{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:#fff;letter-spacing:.2px;}
.brand-text .b2{font-size:10.5px;color:rgba(255,255,255,.78);margin-top:1px;}
nav.nav{padding:14px 12px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;margin-bottom:2px;color:var(--ink-600);font-size:14px;font-weight:500;cursor:pointer;transition:background .12s ease,color .12s ease;border:none;background:none;width:100%;text-align:left;}
.nav-item svg{stroke:var(--ink-400);transition:stroke .12s;}
.nav-item:hover{background:var(--blue-50);color:var(--blue-700);}
.nav-item:hover svg{stroke:var(--blue-700);}
.nav-item.active{background:var(--grad-green);color:#fff;box-shadow:0 4px 12px rgba(0,131,63,.25);}
.nav-item.active svg{stroke:#fff;}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-300);font-weight:600;padding:16px 12px 6px;}
.sidebar-footer{border-top:1px solid var(--line-soft);padding:14px 16px;display:flex;align-items:center;gap:10px;background:#F7FAF7;}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;font-family:var(--font-display);}
.sf-user{flex:1;min-width:0;}
.sf-user .n{font-size:13px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-user .r{font-size:11.5px;color:var(--ink-400);}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;gap:16px;padding:16px 30px;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(0,79,42,.05);}
.search-box{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:#F3F7F3;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--ink-400);}
.search-box input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--ink-900);}
.search-box:focus-within{border-color:var(--blue-600);box-shadow:var(--ring);background:#fff;}
.topbar-spacer{flex:1;}
.topbar-right{display:flex;align-items:center;gap:18px;}
.bell-wrap{position:relative;display:flex;}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink-600);}
.icon-btn svg{stroke:var(--ink-600);}
.badge-dot{position:absolute;top:-4px;right:-4px;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--card);}
.date-pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-600);border:1px solid var(--line);padding:8px 13px;border-radius:9px;white-space:nowrap;}
.date-pill svg{stroke:var(--blue-700);}
.notif-panel{position:absolute;top:46px;right:0;width:340px;max-height:420px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:0 8px 30px rgba(0,79,42,.16);z-index:50;}
.notif-panel .np-head{padding:12px 16px;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--blue-900);border-bottom:1px solid var(--line-soft);}
.notif-item{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;text-align:left;width:100%;background:none;border-left:3px solid transparent;}
.notif-item:hover{background:var(--blue-50);}
.notif-item.unread{background:var(--green-50);border-left-color:var(--blue-700);}
.notif-item .ni-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--amber-50);}
.notif-item .ni-body{flex:1;min-width:0;}
.notif-item .ni-text{font-size:12.8px;color:var(--ink-900);line-height:1.4;}
.notif-item .ni-time{font-size:11px;color:var(--ink-400);margin-top:2px;}
.notif-empty{padding:26px 16px;text-align:center;color:var(--ink-400);font-size:13px;}
#content{padding:26px 30px 60px;max-width:1400px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:23px;}
.page-head .sub{color:var(--ink-600);font-size:14px;margin-top:4px;}
.page-head.hero{background:var(--grad-deep);border-radius:20px;padding:24px 26px;margin-bottom:24px;align-items:center;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,79,42,.22);}
.page-head.hero::before{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);}
.page-head.hero::after{content:"";position:absolute;right:110px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:rgba(200,42,43,.30);}
.page-head.hero>*{position:relative;z-index:1;}
.page-head.hero h1{color:#fff;font-size:26px;}
.page-head.hero .sub{color:rgba(255,255,255,.86);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:filter .12s, background .12s;white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--grad-green);color:#fff;box-shadow:0 3px 10px rgba(0,131,63,.28);}
.btn-primary:hover{background:linear-gradient(135deg,#006B34 0%,#00833F 100%);}
.btn-primary svg{stroke:#fff;}
.page-head.hero .btn-primary{background:#fff;color:var(--blue-800);box-shadow:0 4px 14px rgba(0,0,0,.18);}
.page-head.hero .btn-primary svg{stroke:var(--blue-800);}
.btn-green{background:var(--grad-green);color:#fff;box-shadow:0 3px 10px rgba(0,131,63,.28);}
.btn-green svg{stroke:#fff;}
.btn-outline{background:var(--card);color:var(--ink-700);border-color:var(--line);}
.btn-outline:hover{background:var(--bg);}
.btn-outline svg{stroke:var(--ink-600);}
.btn-danger-outline{background:var(--card);color:var(--red-600);border-color:var(--red-100);}
.btn-danger-outline:hover{background:var(--red-50);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn:focus-visible,.icon-btn:focus-visible,.nav-item:focus-visible,.chip:focus-visible{outline:2px solid var(--blue-600);outline-offset:2px;}
.card{background:var(--card);border:1px solid #E6EDE7;border-radius:16px;box-shadow:var(--shadow-soft);}
.card-pad{padding:20px 22px;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-title .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.section-title h3{font-size:15.5px;color:var(--blue-900);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-green{background:var(--green-100);color:var(--green-700);}
.badge-amber{background:var(--amber-100);color:var(--amber-700);}
.badge-gray{background:var(--line-soft);color:var(--ink-600);}
.badge-red{background:var(--red-100);color:var(--red-600);}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--blue-900);color:#fff;padding:13px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(20,30,60,.25);display:flex;align-items:center;gap:10px;max-width:360px;animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-400);}
.empty-state svg{stroke:var(--ink-300);margin-bottom:10px;}
.empty-state .t{font-size:14.5px;font-weight:600;color:var(--ink-600);margin-bottom:4px;}
.empty-state .d{font-size:13px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid #E6EDE7;border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;}
.stat-card::after{content:"";position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:var(--blue-50);opacity:.8;}
.stat-card>*{position:relative;z-index:1;}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.stat-card .num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--blue-900);margin-top:12px;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-600);margin-top:2px;}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start;}
.list-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line-soft);}
.list-row:last-child{border-bottom:none;}
.list-row .r-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.list-row .r-main{flex:1;min-width:0;}
.list-row .r-main .t1{font-size:13.5px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-row .r-main .t2{font-size:12px;color:var(--ink-400);margin-top:2px;}
.list-row:hover{background:var(--blue-50);border-radius:9px;cursor:pointer;}
.notif-item svg{flex-shrink:0;margin-top:1px;}
.filters-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.chip{padding:8px 16px;border-radius:20px;font-size:12.8px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-600);}
.chip.active{background:var(--grad-green);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(0,131,63,.25);}
.reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px;}
.report-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:var(--radius-lg);padding:19px 20px;box-shadow:var(--shadow-card);cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .12s, box-shadow .12s;}
.report-card:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(20,30,60,.09);}
.report-card[data-status="publie"]{border-top-color:var(--green-600);}
.report-card[data-status="en_attente"]{border-top-color:var(--amber-600);}
.report-card[data-status="brouillon"]{border-top-color:var(--ink-300);}
.report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.report-card h4{font-size:15px;line-height:1.35;color:var(--blue-900);}
.report-card .rc-proj{font-size:12.5px;color:var(--ink-400);margin-top:3px;}
.rc-meta{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-600);}
.rc-meta div{display:flex;align-items:center;gap:7px;}
.rc-meta svg{stroke:var(--ink-400);flex-shrink:0;}
.rc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-soft);padding-top:12px;font-size:12px;color:var(--ink-400);}
.detail-head{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue-700);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:22px 24px;margin-bottom:18px;}
.detail-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.detail-head-left{display:flex;gap:14px;align-items:flex-start;}
.detail-icon{width:46px;height:46px;border-radius:11px;background:var(--green-50);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-icon svg{stroke:var(--green-600);width:24px;height:24px;}
.detail-head h1{font-size:21px;}
.detail-head .proj{font-size:13.5px;color:var(--ink-600);margin-top:3px;}
.detail-actions{display:flex;gap:9px;flex-wrap:wrap;}
.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;}
.meta-box{display:flex;gap:11px;align-items:flex-start;background:var(--bg);border-radius:11px;padding:13px 14px;}
.meta-box .mi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.meta-box .ml .k{font-size:11.5px;color:var(--ink-400);}
.meta-box .ml .v{font-size:13.5px;font-weight:700;color:var(--ink-900);margin-top:1px;line-height:1.3;}
.meta-box .ml .v2{font-size:11.5px;color:var(--ink-400);}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start;}
.stack{display:flex;flex-direction:column;gap:18px;}
.body-text{font-size:13.8px;line-height:1.75;color:var(--ink-700);}
.sub-h{font-size:13px;font-weight:700;color:var(--ink-900);margin:14px 0 7px;}
.sub-h:first-child{margin-top:0;}
ul.plain,ol.plain{margin:0;padding-left:20px;}
ul.plain li,ol.plain li{font-size:13.6px;color:var(--ink-700);line-height:1.7;}
.photo-block{margin-bottom:16px;}
.photo-block:last-child{margin-bottom:0;}
.photo-block img{width:100%;border-radius:12px;display:block;object-fit:cover;height:190px;background:var(--bg);}
.photo-block .cap{font-size:12.5px;color:var(--ink-600);margin-top:7px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
table.tasks-table{width:100%;border-collapse:collapse;min-width:560px;}
.tasks-table th{text-align:left;font-size:11.5px;color:var(--ink-400);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;background:#F3F7F3;}
.tasks-table td{padding:13px 14px;border-bottom:1px solid var(--line-soft);font-size:13.3px;color:var(--ink-700);vertical-align:middle;}
.tasks-table tr:hover td{background:var(--blue-50);}
.row-actions{display:flex;gap:6px;}
.icon-btn-sm{width:30px;height:30px;}
.icon-btn.danger:hover{background:var(--red-50);border-color:var(--red-100);}
.icon-btn.danger:hover svg{stroke:var(--red-600);}
.icon-btn.success{color:var(--blue-700);}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.status-pill.active{background:var(--green-100);color:var(--green-700);}
.status-pill.inactive{background:var(--line-soft);color:var(--ink-500);}
.resp-name-cell{display:flex;align-items:center;gap:10px;}
.resp-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .15s ease;}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.modal-card{background:var(--card);border-radius:20px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(15,20,35,.3);max-height:90vh;overflow-y:auto;animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line-soft);}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line-soft);}
.form-shell{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.8px;font-weight:600;color:var(--ink-700);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--ink-400);font-weight:400;margin-left:6px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid #DCE5DD;border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--ink-900);outline:none;background:var(--card);min-width:0;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue-600);box-shadow:var(--ring);}
.field textarea{resize:vertical;min-height:80px;line-height:1.6;}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.dyn-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.dyn-row{display:flex;gap:8px;align-items:center;}
.dyn-row input{flex:1;}
.dyn-row .rm-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--red-600);}
.add-link{display:inline-flex;align-items:center;gap:7px;font-size:12.8px;font-weight:600;color:var(--blue-700);background:var(--blue-50);padding:11px 14px;border-radius:8px;border:1px dashed var(--blue-100);}
.photo-upload-zone{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-400);font-size:12.8px;cursor:pointer;background:var(--bg);}
.photo-upload-zone:hover{border-color:var(--blue-500);color:var(--blue-600);}
.photo-thumbs{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.photo-thumb{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;align-items:center;}
.photo-thumb img{width:58px;height:58px;object-fit:cover;border-radius:7px;flex-shrink:0;background:var(--bg);}
.photo-thumb input{flex:1;border:none;background:none;font-size:12.5px;outline:none;color:var(--ink-900);}
.side-panel{position:sticky;top:88px;}
.side-panel .card{margin-bottom:16px;}
.validate-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--amber-50);border:1px solid var(--amber-100);border-radius:var(--radius-lg);padding:15px 20px;margin-bottom:18px;}
.validate-bar .vb-text{display:flex;align-items:center;gap:11px;color:var(--amber-700);font-size:13.5px;font-weight:600;}
.comment{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
.comment .c-body{flex:1;min-width:0;}
.comment .c-head{display:flex;align-items:center;gap:8px;}
.comment .c-name{font-size:13px;font-weight:700;color:var(--ink-900);}
.comment .c-time{font-size:11.5px;color:var(--ink-400);}
.comment .c-text{font-size:13.4px;color:var(--ink-700);margin-top:4px;line-height:1.6;}
.comment-form{display:flex;gap:11px;margin-top:14px;align-items:flex-start;}
.comment-form textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.4px;resize:vertical;min-height:44px;outline:none;color:var(--ink-900);}
.whatsapp-btn{color:#25D366;border-color:#25D366;}
.hamburger-btn{display:none;width:auto;height:44px;padding:0 14px 0 12px;gap:8px;border:none;background:var(--grad-green);color:#fff;font-family:var(--font-body);font-size:13.5px;font-weight:700;border-radius:10px;box-shadow:0 3px 10px rgba(0,131,63,.3);align-items:center;justify-content:center;flex-shrink:0;}
.hamburger-btn svg{stroke:#fff;}
#sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:90;}
@media(max-width:1150px){.detail-grid,.form-shell,.notes-row{grid-template-columns:minmax(0,1fr);}.stat-grid{grid-template-columns:repeat(2,1fr);}.meta-grid{grid-template-columns:repeat(2,1fr);}.side-panel{position:static;}}
@media(max-width:1000px){.dash-grid{grid-template-columns:minmax(0,1fr);}}
@media(max-width:900px){
.hamburger-btn{display:inline-flex;}
#sidebar{position:fixed;top:0;left:0;bottom:0;z-index:100;width:min(290px,86vw);transform:translateX(-105%);visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s;padding-bottom:env(safe-area-inset-bottom);}
#sidebar.open{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.28);transition:transform .22s ease, visibility 0s;}
#sidebar .brand{padding-top:calc(18px + env(safe-area-inset-top));}
#sidebarBackdrop.show{display:block;}
body.drawer-open{overflow:hidden;}
#topbar{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));gap:10px;}
.search-box{flex:1;max-width:none;min-width:0;}
.topbar-spacer{display:none;}
#content{padding:20px 18px 56px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{font-size:16px;}
}
@media(max-width:600px){
#content{padding:16px 14px 48px;}
.card-pad{padding:16px;}
.page-head > .btn{width:100%;justify-content:center;}
.field-row2,.field-row3{grid-template-columns:1fr;}
.detail-actions{width:100%;}
.detail-actions .btn{flex:1 1 auto;justify-content:center;}
.modal-overlay{padding:0;align-items:flex-end;}
.modal-card{max-width:none;border-radius:20px 20px 0 0;max-height:92dvh;}
.toast-wrap{left:12px;right:12px;bottom:16px;}
.toast{max-width:none;}
}
@media(pointer:coarse){.btn{min-height:44px;}.icon-btn,.hamburger-btn{width:44px;height:44px;}.icon-btn-sm{width:38px;height:38px;}}

<style id="mobile-enhancements">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{overscroll-behavior-y:none;}
button,a,.chip,.nav-item,select{touch-action:manipulation;}
.card,.report-card,.stat-card{overflow-wrap:anywhere;}
@media(max-width:900px){
#content{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));}
#topbar{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));}
input,textarea,select,.search-box input,.photo-thumb input,.comment-form textarea,.dyn-row input{font-size:16px !important;}
.notif-panel{position:fixed;top:calc(64px + env(safe-area-inset-top));left:12px;right:12px;width:auto;max-height:70dvh;}
}
@media(max-width:700px){
.date-pill{display:none;}
.topbar-right{gap:10px;}
.page-head{gap:12px;margin-bottom:16px;}
.page-head h1{font-size:20px;}
.page-head.hero{padding:18px 18px;border-radius:16px;}
.page-head.hero h1{font-size:21px;}
.page-head.hero::before,.page-head.hero::after{opacity:.6;}
.stat-grid{gap:10px;margin-bottom:18px;}
.stat-card{padding:14px 14px;}
.meta-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.photo-block img{height:170px;}
.filters-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-14px;margin-right:-14px;padding:0 14px 4px;}
.filters-row::-webkit-scrollbar{display:none;}
.filters-row .chip,.filters-row select,.filters-row .btn{flex-shrink:0;}
.chip{padding:10px 16px;}
.modal-foot{position:sticky;bottom:0;background:var(--card);padding-bottom:calc(14px + env(safe-area-inset-bottom));}
.modal-foot .btn{flex:1;justify-content:center;}
.toast-wrap{bottom:calc(16px + env(safe-area-inset-bottom));}
.validate-bar{flex-direction:column;align-items:stretch;}
.validate-bar .btn{width:100%;justify-content:center;}
.comment-form{flex-direction:column;}
.comment-form .btn{width:100%;justify-content:center;}
.side-panel{position:static;}
/* tableaux -> cartes */
.table-scroll{overflow:visible;}
table.tasks-table{min-width:0;display:block;}
.tasks-table thead{display:none;}
.tasks-table tbody{display:block;}
.tasks-table tr{display:block;border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow-card);}
.tasks-table tr:hover td{background:transparent;}
.tasks-table td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-soft);text-align:right;font-size:13.5px;}
.tasks-table td:last-child{border-bottom:none;justify-content:flex-end;}
.tasks-table td[data-label]::before{content:attr(data-label);flex-shrink:0;font-size:11.5px;font-weight:600;color:var(--ink-400);text-align:left;}
.tasks-table td:first-child{text-align:left;justify-content:flex-start;font-size:14.5px;}
.tasks-table td:first-child::before{display:none;}
.tasks-table select{max-width:60%;}
}
@media(max-width:380px){
.stat-grid{grid-template-columns:minmax(0,1fr);}
.meta-grid{grid-template-columns:minmax(0,1fr);}
#content{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
}
@media(max-height:480px) and (orientation:landscape){
#sidebar{width:min(260px,50vw);}
.modal-card{max-height:96dvh;}
}
</style>

async function callManageMember(p){
const norm=v=>v?normalizePhoneSN(v):'';
if(p.action==='invite'){
if(DB.users.some(u=>(u.email||'').toLowerCase()===p.email)){ toast('Cet e-mail existe déjà.'); return null; }
DB.users.push({id:uid('u'), name:p.name, role:p.role, fonction:p.fonction||'', email:p.email, actif:true, phone:p.phone||'', phoneNormalized:norm(p.phone)||'', region:p.region||'', departement:p.departement||'', commune:p.commune||'', coordinateurId:p.coordinateurId||''});
saveLocal(); return {ok:true};
}
const t=DB.users.find(u=>u.id===p.userId);
if(!t){ toast('Compte introuvable.'); return null; }
if(p.action==='update'){
['name','fonction','phone','region','departement','commune','role'].forEach(k=>{ if(p[k]!==undefined) t[k]=p[k]; });
if(p.phone!==undefined) t.phoneNormalized=norm(p.phone)||'';
if(p.coordinateurId!==undefined) t.coordinateurId=t.role==='militant'?(p.coordinateurId||''):'';
saveLocal(); return {ok:true};
}
if(p.action==='toggle_active'){ t.actif=(t.actif===false); saveLocal(); return {ok:true, actif:t.actif}; }
if(p.action==='resend_activation'){ toast("Pas de lien d'activation en mode local."); return null; }
if(p.action==='delete'){ DB.users=DB.users.filter(u=>u.id!==t.id); saveLocal(); return {ok:true}; }
return null;
}

const AVATAR_COLORS = ['#00833F','#006B34','#0A9A4A','#F2C500','#24A95B','#B68F00'];
function initials(name){return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function colorFor(id){const n=(id||'x').split('').reduce((a,c)=>a+c.charCodeAt(0),0);return AVATAR_COLORS[n%AVATAR_COLORS.length];}
function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,9);}
function normalizePhoneSN(raw){
if(!raw) return null;
const digits=raw.replace(/[^\d]/g,'');
if(!digits) return null;
if(digits.startsWith('221') && digits.length===12) return digits;
if(digits.length===9 && /^7[0-8]/.test(digits)) return '221'+digits;
if(digits.startsWith('00221')) return digits.slice(2);
return digits;
}
function waLink(n){ return n? `https://wa.me/${n}` : null; }
function phoneCell(u){
const norm=u.phoneNormalized || normalizePhoneSN(u.phone||'');
if(!u.phone) return '<span style="color:var(--ink-300)">—</span>';
const link=waLink(norm);
return `<div style="display:flex;align-items:center;gap:8px;white-space:nowrap;"><span>${u.phone}</span>${link?`<a href="${link}" target="_blank" rel="noopener" class="icon-btn icon-btn-sm whatsapp-btn" title="Ouvrir WhatsApp">${icon('whatsapp','icon-sm','#25D366')}</a>`:''}</div>`;
}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function timeAgo(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60) return "à l'instant"; if(s<3600) return Math.floor(s/60)+' min'; if(s<86400) return Math.floor(s/3600)+' h'; return Math.floor(s/86400)+' j'; }

const el=document.createElement('div'); el.className='toast';

async function notifyCoordinateur(report){
const author=userById(report.createdBy);
const recipients=DB.users.filter(u=>u.id===report.submittedTo || u.role==='qg_national');
const newNotifs=recipients.map(u=>({id:uid('n'), userId:u.id, reportId:report.id, text:`${author.name} a soumis « ${report.title} » pour validation`, createdAt:Date.now(), read:false}));
DB.notifications.push(...newNotifs);
if(sb){ for(const n of newNotifs){ await sbInsert('notifications', mapNotifToDb(n)); } }
}
function whatsappSubmitLink(report){
const coord=DB.users.find(u=>u.id===report.submittedTo);
if(!coord) return null;
const norm=coord.phoneNormalized || normalizePhoneSN(coord.phone||'');
if(!norm) return null;
const link=`${location.href.split("#")[0].split("?")[0]}?report=${report.id}`;
const msg=`Bonjour ${coord.name},\n\nUn nouveau rapport d'activité « ${report.title} » vous a été envoyé pour validation.\n\nConsultez-le ici (connectez-vous si besoin) :\n${link}`;
return `https://wa.me/${norm}?text=${encodeURIComponent(msg)}`;
}
async function notifyAllOnPublish(report){
const author=userById(report.createdBy);
const recipients=DB.users.filter(u=>u.id!==report.createdBy);
const newNotifs=recipients.map(u=>({id:uid('n'), userId:u.id, reportId:report.id, text:`${author.name} a publié « ${report.title} »`, createdAt:Date.now(), read:false}));
DB.notifications.push(...newNotifs);
if(sb){ for(const n of newNotifs){ await sbInsert('notifications', mapNotifToDb(n)); } }
}
function unreadFor(userId){return DB.notifications.filter(n=>n.userId===userId && !n.read).length;}
function markAllRead(userId){
DB.notifications.forEach(n=>{if(n.userId===userId)n.read=true;});
if(sb) sb.from('notifications').update({read:true}).eq('user_id',userId).eq('read',false).then(({error})=>{if(error)console.error(error);});
}

async function fetchReportById(id){
state.reportLookup=state.reportLookup||{};
try{
const {data,error}=await sb.from('reports').select('*').eq('id',id).maybeSingle();
if(error) throw error;
if(data){ if(!DB.reports.some(x=>x.id===data.id)) DB.reports.unshift(mapReportFromDb(data)); delete state.reportLookup[id]; }
else{ state.reportLookup[id]='missing'; }
}catch(e){ console.error(e); state.reportLookup[id]='missing'; }
if(state.view==='report-detail' && state.activeReportId===id) renderContent();
}
function reportNotFoundHtml(){
const id=state.activeReportId;
state.reportLookup=state.reportLookup||{};
if(sb && id && !state.reportLookup[id]){ state.reportLookup[id]='loading'; fetchReportById(id); }
if(state.reportLookup[id]==='loading'){ return `<div class="card"><div class="empty-state">${icon('clock','icon')}<div class="t">Recherche du rapport…</div></div></div>`; }
return `<div class="card"><div class="empty-state">${icon('file','icon')}<div class="t">Rapport introuvable</div><div class="d">Il a peut-être été supprimé, ou vous n'avez pas accès.</div><div style="margin-top:16px;"><button class="btn btn-primary" data-nav="reports">Voir tous les rapports</button></div></div></div>`;
}

saveBtn.disabled=true; saveBtn.textContent='Création…';

let photoStore=[];
function fileToResizedDataUrl(file,maxSide,quality){
return new Promise((resolve,reject)=>{
const fr=new FileReader();
fr.onerror=()=>reject(fr.error);
fr.onload=()=>{
const img=new Image();
img.onerror=()=>reject(new Error('image'));
img.onload=()=>{
const k=Math.min(1,maxSide/Math.max(img.width,img.height));
const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
c.getContext('2d').drawImage(img,0,0,c.width,c.height);
resolve(c.toDataURL('image/jpeg',quality));
};
img.src=fr.result;
};
fr.readAsDataURL(file);
});
}

document.getElementById('submitReportBtn').onclick=async()=>{

if(photoStore.some(p=>p.uploading)){ toast('Patientez, une photo est en cours de téléversement.'); return; }
const submitBtn=document.getElementById('submitReportBtn');
const waWindow=window.open('','_blank');
const report=collectReport('en_attente');
submitBtn.disabled=true;
const saved=await sbInsert('reports', mapReportToDb(report));
if(!saved){ if(waWindow) waWindow.close(); submitBtn.disabled=false; return; }
DB.reports.unshift(report);
notifyCoordinateur(report);
toast('Rapport envoyé au coordinateur pour validation.');
const waLink=whatsappSubmitLink(report);
if(waLink && waWindow){ waWindow.location.href=waLink; } else if(waWindow){ waWindow.close(); }
setView('report-detail',{activeReportId:report.id});
};
document.getElementById('draftReportBtn').onclick=async()=>{
if(photoStore.some(p=>p.uploading)){ toast('Patientez, une photo est en cours de téléversement.'); return; }
const draftBtn=document.getElementById('draftReportBtn');
const report=collectReport('brouillon');
draftBtn.disabled=true;
const saved=await sbInsert('reports', mapReportToDb(report));
if(!saved){ draftBtn.disabled=false; return; }
DB.reports.unshift(report);
toast('Brouillon enregistré.');
setView('reports');
};
}
}

function renderContent(){
const c=document.getElementById('content');
if(state.view==='dashboard') c.innerHTML=viewDashboard();
else if(state.view==='reports') c.innerHTML=viewReportsList();
else if(state.view==='report-detail') c.innerHTML=viewReportDetail();
else if(state.view==='new-report') c.innerHTML=viewNewReport();
else if(state.view==='tasks') c.innerHTML=viewTasks();
else if(state.view==='membres'){ c.innerHTML=viewMembres(); wireMembres(); }
c.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));
c.querySelectorAll('[data-goto-report]').forEach(b=>b.onclick=()=>setView('report-detail',{activeReportId:b.dataset.gotoReport}));
c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ state.reportFilter=b.dataset.filter; renderContent(); });
c.querySelectorAll('[data-edit-report]').forEach(b=>b.onclick=()=>setView('new-report',{editingReportId:b.dataset.editReport}));
if(state.view==='new-report') wireNewReportForm();
if(state.view==='tasks'){
const addTask=document.getElementById('addTaskBtn'); if(addTask) addTask.onclick=()=>openTaskModal();
c.querySelectorAll('[data-task-status]').forEach(sel=>sel.onchange=()=>{ const t=DB.tasks.find(x=>x.id===sel.dataset.taskStatus); if(t){ t.status=sel.value; saveLocal(); toast('Statut mis à jour.'); } });
c.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{
const t=DB.tasks.find(x=>x.id===b.dataset.delTask);
if(t && confirm(`Supprimer « ${t.title} » ?`)){ DB.tasks=DB.tasks.filter(x=>x.id!==t.id); sbDelete('tasks',t.id); renderContent(); }
});
}
if(state.view==='report-detail'){
const r=DB.reports.find(x=>x.id===state.activeReportId);
const validateBtn=document.getElementById('validateBtn');
if(validateBtn){
validateBtn.onclick=async()=>{
if(!r) return;
validateBtn.disabled=true; validateBtn.textContent='Validation…';
try{
r.status='publie'; r.publishedAt=Date.now(); r.validatedBy=state.currentUserId; r.validatedAt=Date.now();
await sbUpdate('reports',{status:r.status, published_at:r.publishedAt, validated_by:r.validatedBy, validated_at:r.validatedAt}, r.id);
await notifyAllOnPublish(r);
if(!r.isShared){ r.isShared=true; r.sharedAt=Date.now(); if(!r.shareToken) r.shareToken=uid('share'); await sbUpdate('reports',{is_shared:true, shared_at:r.sharedAt, share_token:r.shareToken}, r.id); }
toast('Rapport validé. Cliquez sur « Partager » pour l\'envoyer par WhatsApp.');
renderContent(); renderTopbar(); renderSidebar();
}catch(err){ console.error(err); toast('Erreur lors de la validation.'); validateBtn.disabled=false; validateBtn.textContent='Valider'; }
};
}
const rejectBtn=document.getElementById('rejectBtn');
if(rejectBtn){ rejectBtn.onclick=()=>{ r.status='brouillon'; toast('Renvoyé pour révision.'); sbUpdate('reports',{status:r.status}, r.id); setView('reports'); }; }
const shareBtn=document.getElementById('shareReportBtn');
if(shareBtn){
shareBtn.onclick=async()=>{
const link=`${location.href.split("#")[0].split("?")[0]}?report=${r.id}`;
if(!r.isShared){ r.isShared=true; r.sharedAt=Date.now(); if(!r.shareToken) r.shareToken=uid('share'); await sbUpdate('reports',{is_shared:true, shared_at:r.sharedAt, share_token:r.shareToken}, r.id); }
const msg=`Rapport d'activité « ${r.title} » validé :\n${link}`;
window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
toast('Lien prêt — choisissez le contact/groupe WhatsApp.');
renderContent();
};
}
const copyBtn=document.getElementById('copyShareLinkBtn');
if(copyBtn){ copyBtn.onclick=async()=>{ const input=document.getElementById('shareLinkInput'); try{ await navigator.clipboard.writeText(input.value); toast('Lien copié.'); }catch(e){ input.select(); document.execCommand('copy'); toast('Lien copié.'); } }; }
const deleteBtn=document.getElementById('deleteReportBtn');
if(deleteBtn){ deleteBtn.onclick=async()=>{ if(!confirm(`Supprimer « ${r.title} » ? Action définitive.`)) return; await sbDelete('reports', r.id); DB.reports=DB.reports.filter(x=>x.id!==r.id); toast('Rapport supprimé.'); setView('reports'); }; }
const postBtn=document.getElementById('postCommentBtn');
if(postBtn){ postBtn.onclick=()=>{ const ta=document.getElementById('newCommentText'); const text=ta.value.trim(); if(!text) return;
r.comments.push({id:uid('c'), authorId:state.currentUserId, text, createdAt:Date.now()});
toast('Commentaire ajouté.'); sbUpdate('reports',{comments:r.comments}, r.id); renderContent(); }; }
}
}
function render(){ if(DB.users.length) saveLocal(); renderSidebar(); renderTopbar(); renderContent(); const bd=document.getElementById('sidebarBackdrop'); if(bd) bd.onclick=closeMobileSidebar; }

async function submitLogin(){
const email=(document.getElementById('authEmail')?.value||'').trim().toLowerCase();
const phoneRaw=document.getElementById('authPhone')?.value.trim();
const pw=document.getElementById('authPw').value;
const errEl=document.getElementById('authError'); errEl.textContent='';
if((!email && !phoneRaw) || !pw){ errEl.textContent='Renseignez votre e-mail (ou téléphone) et votre mot de passe.'; return; }
let loginEmail=email;
if(!loginEmail && phoneRaw){
const norm=normalizePhoneSN(phoneRaw);
if(!norm){ errEl.textContent='Numéro invalide.'; return; }
let stored=null; try{ stored=JSON.parse(localStorage.getItem(LS_DB_KEY)||'null'); }catch(e){}
const found=((stored&&stored.users)||[]).find(u=>u.phoneNormalized===norm);
if(!found || !found.email){ errEl.textContent='Aucun compte trouvé pour ce numéro.'; return; }
loginEmail=found.email.toLowerCase();
}
if(loginEmail!==ADMIN_EMAIL || pw!==ADMIN_PASSWORD){ errEl.textContent='E-mail ou mot de passe incorrect.'; return; }
try{ localStorage.setItem(LS_SESSION_KEY, ADMIN_EMAIL); }catch(e){}
state.currentUserId=ADMIN_PROFILE.id;
await startApp();
}
async function submitSetPassword(){ renderAuthScreen('login'); }
async function logout(){
try{ localStorage.removeItem(LS_SESSION_KEY); }catch(e){}
state.currentUserId=null; appStartedFor=null;
renderAuthScreen('login');
}
async function startApp(){
appStartedFor=state.currentUserId;
try{ await loadProfiles(); await loadFromSupabase(); }catch(e){ console.error(e); toast("Chargement des données locales impossible."); }
document.getElementById('authScreen').style.display='none';
document.getElementById('shell').style.display='flex';
if(deepLinkReportId){ const rid=deepLinkReportId; deepLinkReportId=null; setView('report-detail',{activeReportId:rid}); } else { render(); }
}
(async function init(){
let sess=null; try{ sess=localStorage.getItem(LS_SESSION_KEY); }catch(e){}
if(sess===ADMIN_EMAIL){ state.currentUserId=ADMIN_PROFILE.id; await startApp(); }
else { renderAuthScreen('login'); }
})();

if(!isSetPw){

}

let raf=0;
function labelTables(){
document.querySelectorAll('table.tasks-table').forEach(t=>{
const heads=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
t.querySelectorAll('tbody tr').forEach(tr=>{
[...tr.children].forEach((td,i)=>{ if(heads[i]&&!td.hasAttribute('data-label')) td.setAttribute('data-label',heads[i]); });
});
});
}
new MutationObserver(()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(labelTables); }).observe(document.body,{childList:true,subtree:true});
})();
